<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Visual POS & Stock — ระบบขายหน้าร้านและจัดการสต็อก (3-Level SKU Drill-Down)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --ink: #0f172a;
      --muted: #64748b;
      --brand: #0f766e;
      --brand-hover: #115e59;
      --brand-soft: #f0fdfa;
      --brand-border: #99f6e4;
      --brand-ink: #ffffff;
      --pack: #7c3aed;
      --pack-soft: #f5f3ff;
      --pack-border: #ddd6fe;
      --warning: #d97706;
      --warning-soft: #fffbeb;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow: 0 4px 12px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.14);
      --font: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Main 3-Column Single-Screen Shell (Outer Window Fixed 100vh) */
    .app-shell {
      display: grid;
      grid-template-columns: 92px 1fr 375px;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 76px 1fr 310px; }
    }

    /* 1. Left Navigation Rail */
    .left-rail {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 8px;
      border-right: 1px solid #1e293b;
      z-index: 20;
    }

    .rail-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .rail-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--brand);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.15rem;
      box-shadow: 0 4px 10px rgba(15, 118, 110, 0.35);
    }

    .rail-brand-text {
      font-size: 0.6875rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .rail-nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .rail-tab-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: #94a3b8;
      padding: 12px 6px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      transition: all 0.15s ease;
      text-align: center;
      line-height: 1.3;
    }

    .rail-tab-btn:hover { background: #1e293b; color: #f8fafc; }
    .rail-tab-btn.active {
      background: var(--brand);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.35);
    }

    .rail-footer { text-align: center; width: 100%; }
    .sample-tag {
      display: inline-block;
      font-size: 0.625rem;
      font-weight: 600;
      color: #cbd5e1;
      background: #1e293b;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1.2;
    }

    /* 2. Center Workspace */
    .center-stage {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 16px 20px;
      gap: 12px;
    }

    /* Top Real-Time Search Bar & Dropdown */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface);
      padding: 10px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .search-wrapper { position: relative; flex: 1; max-width: 560px; }
    .search-input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-subtle);
      border: 1.5px solid var(--border-strong);
      border-radius: 10px;
      padding: 8px 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input-box:focus-within {
      border-color: var(--brand);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .search-input {
      border: none;
      background: transparent;
      width: 100%;
      font: inherit;
      font-size: 0.9375rem;
      color: var(--ink);
      outline: none;
    }

    .search-clear-btn {
      border: none;
      background: #e2e8f0;
      color: var(--ink);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      z-index: 50;
      max-height: 320px;
      overflow-y: auto;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--brand-soft); }

    .sr-left { display: flex; align-items: center; gap: 10px; }
    .sr-sku {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .sr-name { font-weight: 600; font-size: 0.9rem; }
    .sr-right { display: flex; align-items: center; gap: 12px; }
    .sr-stock { font-size: 0.75rem; color: var(--muted); }
    .sr-price { font-weight: 700; color: var(--brand); font-size: 0.9375rem; }

    /* Breadcrumb / Stage Header */
    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .stage-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .back-cat-btn {
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .back-cat-btn:hover {
      background: var(--surface-subtle);
      border-color: var(--brand);
      color: var(--brand);
    }

    .stage-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: var(--brand);
      border: 1px solid var(--brand-border);
    }

    .mode-pill.stock-mode {
      background: var(--warning-soft);
      color: var(--warning);
      border-color: #fde68a;
    }

    /* Level 1: Category Grid */
    .category-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: minmax(150px, 1fr);
      gap: 14px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }

    .category-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .category-card:hover {
      transform: translateY(-2px);
      border-color: var(--brand);
      box-shadow: var(--shadow);
    }

    .cat-illust {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cat-name { font-size: 1.05rem; font-weight: 700; margin: 0; color: var(--ink); }
    .cat-meta { font-size: 0.78rem; color: var(--muted); margin: 0; }

    /* Level 2 (SKU Prefix Group Grid) & Level 3 (Sub-item Grid) */
    .product-grid-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    .product-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      grid-auto-rows: 214px;
      gap: 14px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
      padding-bottom: 6px;
      align-content: start;
    }

    .product-grid::-webkit-scrollbar,
    .summary-list::-webkit-scrollbar,
    .search-dropdown::-webkit-scrollbar { width: 6px; }

    .product-grid::-webkit-scrollbar-thumb,
    .summary-list::-webkit-scrollbar-thumb,
    .search-dropdown::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    .product-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 12px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
      position: relative;
      overflow: hidden;
    }

    .product-card:hover {
      border-color: var(--brand);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    /* Group Card specific badge (Level 2: e.g., HK-DMN) */
    .prefix-group-badge {
      position: absolute;
      top: 9px;
      left: 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: #0f172a;
      color: #ffffff;
      z-index: 2;
    }

    /* Sub-item Card when switched to Big Pack mode */
    .product-card.pack-mode-active {
      border-color: var(--pack-border);
      background: var(--pack-soft);
    }

    .product-card.pack-mode-active:hover { border-color: var(--pack); }

    .product-card.selected-for-edit {
      border-color: var(--warning) !important;
      background: var(--warning-soft) !important;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.16);
    }

    /* Unit Toggle Switch on Top-Left of Sub-Card (Default = ชิ้นเล็ก) */
    .unit-toggle-pill {
      position: absolute;
      top: 9px;
      left: 9px;
      display: inline-flex;
      background: #f1f5f9;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 2px;
      z-index: 3;
    }

    .unit-opt-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      cursor: pointer;
      line-height: 1.25;
      transition: all 0.12s ease;
    }

    .unit-opt-btn.active-piece { background: var(--brand); color: #ffffff; }
    .unit-opt-btn.active-pack { background: var(--pack); color: #ffffff; }

    /* Remaining Stock Badge at Top-Right Corner */
    .prod-stock-badge {
      position: absolute;
      top: 9px;
      right: 9px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-subtle);
      border: 1px solid var(--border-strong);
      color: var(--ink);
      z-index: 2;
    }

    .prod-stock-badge.pack-stock {
      background: #ede9fe;
      border-color: #c4b5fd;
      color: #5b21b6;
    }

    .prod-stock-badge.low {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
    }

    /* Product Image Centered in the Middle */
    .prod-center-image {
      margin-top: 26px;
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
      overflow: visible;
    }

    .prod-real-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    .prod-icon-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Remainder of SKU / Spec Pill under the centered image */
    .prod-spec-pill {
      position: absolute;
      bottom: -8px;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.22);
    }

    .prod-spec-pill.pack-pill { background: var(--pack); }
    .prod-spec-pill.group-count-pill { background: var(--brand); }

    /* Product Name & Details at the Bottom */
    .prod-bottom-info {
      width: 100%;
      margin-top: 10px;
      padding-top: 7px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .prod-name {
      font-size: 0.86rem;
      font-weight: 700;
      margin: 0;
      color: var(--ink);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
    }

    .prod-sub-pack-hint { font-size: 0.68rem; color: var(--muted); }

    .prod-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 2px;
    }

    .prod-sku {
      font-size: 0.66rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .prod-price { font-size: 0.94rem; font-weight: 700; color: var(--brand); }
    .prod-price.pack-price { color: var(--pack); }

    /* Inline Stock / Price / Unpack Editor Bar */
    .stock-editor-bar {
      background: var(--surface);
      border: 1.5px solid var(--warning);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }

    .editor-action-tabs {
      display: inline-flex;
      background: var(--surface-subtle);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 2px;
      gap: 4px;
    }

    .editor-tab-btn {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .editor-tab-btn.active { background: var(--warning); color: #ffffff; }

    .editor-fields { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .editor-field { display: flex; align-items: center; gap: 6px; }
    .editor-field label { font-size: 0.78rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .editor-input {
      width: 84px;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      text-align: right;
    }

    /* 3. Right Summary Sidebar */
    .right-summary {
      background: var(--surface);
      border-left: 1px solid var(--border);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      box-shadow: -4px 0 16px rgba(15, 23, 42, 0.03);
      z-index: 15;
    }

    .summary-header {
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .summary-title { margin: 0; font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .summary-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--brand-soft);
      color: var(--brand);
      border: 1px solid var(--brand-border);
    }

    .summary-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 4px 12px 0;
      min-height: 0;
      overflow-y: auto;
    }

    .summary-empty { margin: auto; text-align: center; color: var(--muted); font-size: 0.85rem; padding: 20px; }

    .summary-item {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .sum-item-info { min-width: 0; flex: 1; }
    .sum-item-name { font-size: 0.84rem; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum-item-sub { font-size: 0.72rem; color: var(--muted); }

    .qty-stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }

    .step-btn { border: none; background: transparent; width: 24px; height: 24px; font-weight: 700; cursor: pointer; color: var(--ink); }
    .step-btn:hover { background: var(--surface-subtle); }
    .step-val { padding: 0 8px; font-size: 0.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sum-item-total { font-size: 0.875rem; font-weight: 700; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }

    .summary-footer { border-top: 1px solid var(--border); padding-top: 12px; flex-shrink: 0; }
    .totals-box { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; }
    .tot-row { display: flex; justify-content: space-between; font-size: 0.8125rem; color: var(--muted); margin-bottom: 4px; }
    .tot-row.grand { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border-strong); font-size: 1.15rem; font-weight: 700; color: var(--ink); margin-bottom: 0; }

    .btn {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn-primary { background: var(--brand); color: var(--brand-ink); }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-warning { background: var(--warning); color: #ffffff; }
    .btn-warning:hover { background: #b45309; }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border-strong); }
    .btn-secondary:hover { background: var(--surface-subtle); }

    .action-stack { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }

    .modal-title { margin: 0 0 8px; font-size: 1.15rem; font-weight: 700; }
    .modal-body {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin: 12px 0 18px;
      font-size: 0.85rem;
      max-height: 240px;
      overflow-y: auto;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

    /* Printable Receipt & Database Modal Styles */
    .receipt-modal-card { max-width: 680px; max-height: 92vh; overflow-y: auto; }
    .print-format-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-top: 10px;
    }

    .format-options { display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .format-btn {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .format-btn.active { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

    .receipt-paper {
      background: #fafafa;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin: 12px 0;
      max-height: 52vh;
      overflow-y: auto;
    }

    .invoice-sheet { background: #ffffff; color: #0f172a; border: 1px solid var(--border-strong); border-radius: 6px; padding: 16px 20px; font-size: 0.8125rem; }
    .invoice-sheet.format-80mm { max-width: 310px; margin: 0 auto; }
    .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #0f172a; padding-bottom: 8px; margin-bottom: 10px; gap: 12px; }
    .invoice-copy-badge { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border: 1px solid #0f172a; border-radius: 4px; white-space: nowrap; }
    .invoice-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.8125rem; }
    .invoice-table th, .invoice-table td { padding: 5px 6px; border-bottom: 1px solid #cbd5e1; text-align: left; }
    .invoice-table th.num, .invoice-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .invoice-table th { background: #f1f5f9; color: #0f172a; font-weight: 700; }
    .invoice-totals { margin-top: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .invoice-signatures { display: flex; justify-content: space-between; gap: 24px; margin-top: 16px; padding-top: 8px; font-size: 0.75rem; text-align: center; }
    .sig-box { flex: 1; }
    .sig-line { border-bottom: 1px dotted #475569; height: 22px; margin-bottom: 4px; }
    .cut-divider { border-top: 1px dashed #64748b; margin: 14px 0; text-align: center; font-size: 0.75rem; color: #475569; }

    .db-status-msg { font-size: 0.82rem; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 12px; border: 1px solid var(--border); background: var(--surface-subtle); }
    .db-status-msg.error { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }
    .db-status-msg.success { background: var(--success-soft); color: var(--success); border-color: #bbf7d0; }
